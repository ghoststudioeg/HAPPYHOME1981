    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" crossorigin="anonymous">

  <body class="bg-[#05080D] text-[#F8FAFC] font-['Cairo',sans-serif] antialiased selection:bg-[#D4AF37] selection:text-[#05080D]">
    <script>
      // Automatically set the partitioned cookie for AI Studio sandboxed iframe compatibility
      try {
        const host = window.location.hostname;
        document.cookie = `__SECURE-aistudio_auth_flow_may_set_cookies=true; Path=/; Secure; SameSite=None; Domain=${host}; Partitioned; Max-Age=604800;`;
      } catch (e) {}

      // Gracefully handle benign Vite HMR websocket disconnection in sandboxed environments
      window.addEventListener('unhandledrejection', function (event) {
        // ALWAYS LOG UNHANDLED REJECTIONS
        console.error('[EARLY_UNHANDLED_REJECTION]', event.reason);

        if (event.reason && (
          event.reason.message?.includes('WebSocket') ||
          event.reason.message?.includes('ws') ||
          String(event.reason).includes('WebSocket closed without opened')
        )) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function (event) {
        // ALWAYS LOG ERRORS
        console.error('[EARLY_GLOBAL_ERROR]', event.error || event.message);

        if (event.message && (
          event.message.includes('WebSocket') ||
          event.message.includes('[vite]')
        )) {
          event.preventDefault();
        }
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
